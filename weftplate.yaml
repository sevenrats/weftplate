# weftplate — expose N dry-contact switches as Home Assistant events over
# Thread or Wi-Fi, on an ESP32-C6, using ESPHome.
#
# Each switch is wired between a GPIO (internal pull-up) and GND. Every time a
# switch changes position (closed <-> open), its event entity fires "toggled".
#
# The number of switches (1..6, default 6) and the transport (thread or wifi,
# default thread) are set at build time:
#   esphome -s num_switches 3 -s transport wifi compile weftplate.yaml
#
# Dry contacts ONLY. These GPIOs carry the C6's own 3.3V logic to GND through
# your switch. Never connect them to mains or any external voltage.

substitutions:
  name: weftplate
  friendly_name: weftplate
  # Switch count, 1..6. Switches 1..num_switches are exposed to Home Assistant.
  num_switches: "6"
  # Transport to Home Assistant: thread or wifi. Selects transport/<transport>.yaml.
  transport: thread
  # Software debounce window.
  debounce: 40ms

# Switch input pins for the Seeed XIAO ESP32-C6: the board's D0..D5 pads (a
# contiguous run on one side), avoiding the strapping, flash and USB pins. For a
# different C6 board, change the pins here. Raw GPIO numbers differ from the
# XIAO's Dx labels.
packages:
  transport: !include transport/${transport}.yaml
  switch_1: !include { file: switch.yaml, vars: { index: 1, pin: GPIO0 } }   # D0
  switch_2: !include { file: switch.yaml, vars: { index: 2, pin: GPIO1 } }   # D1
  switch_3: !include { file: switch.yaml, vars: { index: 3, pin: GPIO2 } }   # D2
  switch_4: !include { file: switch.yaml, vars: { index: 4, pin: GPIO21 } }  # D3
  switch_5: !include { file: switch.yaml, vars: { index: 5, pin: GPIO22 } }  # D4
  switch_6: !include { file: switch.yaml, vars: { index: 6, pin: GPIO23 } }  # D5

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  # Unique hostname per unit, so several modules can share one network.
  name_add_mac_suffix: true
  on_boot:
    then:
      - logger.log: "weftplate up: ${num_switches} switch(es) over ${transport}"

esp32:
  board: seeed_xiao_esp32c6
  framework:
    type: esp-idf

logger:

# --- Home Assistant link, carried over the selected transport ---
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password
